<style>
  :root{
    --navy-950:#05131F; --navy-900:#081C2B; --navy-850:#0B2233; --navy-800:#0E2837; --navy-700:#173A4E;
    --line:rgba(255,255,255,.09); --line-strong:rgba(255,255,255,.16);
    --emerald:#00D19A; --emerald-dim:#0A3D31; --green-deep:#196C52; --forest:#386641;
    --gold:#D4A95A; --gold-dim:#3A2F17;
    --danger:#FF7A6B; --danger-dim:#3C1D18;
    --ink:#F2F7F5; --muted:#8FA6A0; --slate:#90A1B9; --faint:#5E7370;
    --font-ui:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --font-data:ui-monospace,'SF Mono','Cascadia Mono','Roboto Mono',Menlo,monospace;
    --r-lg:20px; --r-md:14px; --r-sm:10px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:#020A12;
    background-image:radial-gradient(1200px 600px at 70% -10%, rgba(0,209,154,.07), transparent 60%),
                     radial-gradient(900px 500px at 10% 110%, rgba(212,169,90,.05), transparent 60%);
    font-family:var(--font-ui); color:var(--ink);
    display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px 12px;
  }
  /* ---------- phone frame ---------- */
  .phone{
    width:min(400px,100%); height:min(860px,calc(100vh - 32px)); min-height:640px;
    background:var(--navy-950); border:1px solid var(--line-strong); border-radius:34px;
    box-shadow:0 40px 90px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.06);
    display:flex; flex-direction:column; overflow:hidden; position:relative;
  }
  .statusbar{height:34px; flex:none; display:flex; align-items:center; justify-content:space-between;
    padding:0 22px; font-size:12px; color:var(--faint); font-family:var(--font-data); letter-spacing:.04em}
  .appbar{height:52px; flex:none; display:flex; align-items:center; gap:10px; padding:0 14px; position:relative; z-index:5}
  .appbar .back{width:36px;height:36px;border-radius:12px;border:1px solid var(--line);background:var(--navy-900);
    color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
  .appbar .back:hover{color:var(--ink);border-color:var(--line-strong)}
  .appbar .crumb{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:600}
  .appbar .spacer{flex:1}
  .appbar .step-count{font-family:var(--font-data);font-size:12px;color:var(--faint)}
  .screen{flex:1; overflow-y:auto; overflow-x:hidden; padding:6px 20px 120px; scrollbar-width:thin; scrollbar-color:var(--navy-700) transparent}
  .screen::-webkit-scrollbar{width:4px}
  .screen::-webkit-scrollbar-thumb{background:var(--navy-700);border-radius:2px}
  .cta-dock{position:absolute; left:0; right:0; bottom:0; padding:14px 20px 22px; z-index:6;
    background:linear-gradient(to top, var(--navy-950) 55%, transparent)}
  .btn{width:100%; border:none; border-radius:16px; padding:16px 18px; font-family:var(--font-ui);
    font-size:16px; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;
    transition:transform .08s ease, filter .15s ease}
  .btn:active{transform:scale(.985)}
  .btn:focus-visible,.back:focus-visible,.chip:focus-visible,.card-btn:focus-visible,input:focus-visible,.seg button:focus-visible{
    outline:2px solid var(--emerald); outline-offset:2px}
  .btn-primary{background:var(--emerald); color:#04241B}
  .btn-primary:hover{filter:brightness(1.06)}
  .btn-primary:disabled{background:var(--navy-800);color:var(--faint);cursor:not-allowed}
  .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
  .btn-gold{background:var(--gold);color:#2A1F08}
  .progress{height:3px;background:var(--navy-800);border-radius:2px;overflow:hidden;margin:2px 0 18px}
  .progress i{display:block;height:100%;background:var(--emerald);border-radius:2px;transition:width .35s cubic-bezier(.4,0,.2,1)}

  /* ---------- shared type ---------- */
  .eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--emerald);font-weight:700;margin-bottom:10px}
  .eyebrow.gold{color:var(--gold)}
  h1{font-size:30px;line-height:1.15;letter-spacing:-.02em;font-weight:700}
  h2{font-size:22px;line-height:1.2;letter-spacing:-.01em;font-weight:700}
  .lede{color:var(--muted);font-size:15px;line-height:1.55;margin-top:10px}
  .data{font-family:var(--font-data);font-variant-numeric:tabular-nums}

  /* ---------- welcome ---------- */
  .brandmark{display:flex;align-items:center;gap:10px;margin:18px 0 34px}
  .brandmark .bx{width:34px;height:34px;border-radius:10px;background:linear-gradient(140deg,var(--green-deep),var(--emerald));
    display:flex;align-items:center;justify-content:center}
  .brandmark .bx svg{width:18px;height:18px}
  .brandmark span{font-weight:700;font-size:16px;letter-spacing:-.01em}
  .brandmark small{color:var(--faint);font-weight:500}
  .hero-verdict{margin:26px 0 8px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--navy-900);padding:18px;position:relative;overflow:hidden}
  .hero-verdict::after{content:"";position:absolute;inset:0;background:radial-gradient(300px 140px at 85% 0%,rgba(0,209,154,.12),transparent 70%);pointer-events:none}
  .hv-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .hv-addr{font-size:13px;color:var(--muted)}
  .hv-addr b{display:block;color:var(--ink);font-size:15px;margin-bottom:2px}
  .stamp{font-family:'Poppins',var(--font-ui);font-weight:700;font-size:13px;letter-spacing:.12em;border-radius:8px;padding:7px 12px;border:1.5px solid}
  .stamp.go{color:var(--emerald);border-color:var(--emerald);background:rgba(0,209,154,.08)}
  .stamp.pursue{color:var(--gold);border-color:var(--gold);background:rgba(212,169,90,.08)}
  .stamp.nogo{color:var(--slate);border-color:var(--slate);background:rgba(144,161,185,.08)}
  .hv-lever{margin-top:14px;font-size:13.5px;color:var(--muted)}
  .hv-lever b{color:var(--gold);font-family:var(--font-data)}
  .free-note{display:flex;gap:10px;align-items:flex-start;margin-top:22px;color:var(--faint);font-size:12.5px;line-height:1.5}
  .free-note svg{flex:none;margin-top:1px}

  /* ---------- option cards ---------- */
  .card-btn{width:100%;text-align:left;background:var(--navy-900);border:1px solid var(--line);border-radius:var(--r-md);
    padding:16px;cursor:pointer;display:flex;align-items:center;gap:14px;margin-bottom:10px;transition:border-color .15s,background .15s;color:var(--ink);font-family:var(--font-ui)}
  .card-btn:hover{border-color:var(--emerald);background:var(--navy-850)}
  .card-btn.dis{opacity:.85}
  .card-btn.dis:hover{border-color:var(--gold)}
  .card-btn .ic{width:42px;height:42px;flex:none;border-radius:12px;background:var(--navy-800);display:flex;align-items:center;justify-content:center;color:var(--emerald)}
  .card-btn.dis .ic{color:var(--faint)}
  .card-btn .tx b{display:block;font-size:15.5px;margin-bottom:2px;font-weight:600}
  .card-btn .tx span{font-size:13px;color:var(--muted);line-height:1.4;display:block}

<script>
/* ConstructFi Deal Screener — clickable prototype
   Engines per v1 spec: rental (Buy & Hold, from the Eluvial Academy Deal Analyzer, with §2.3 corrections) + flip.
   Verdict: GO / PURSUE WITH CONDITIONS / NO-GO per §3. Financing Readiness per §7a (educational). */

(function(){
"use strict";

/* ---------------- state ---------------- */
var S = {
  route:"welcome", goal:null, asset:"sf", qIndex:0, proto:{}, touched:{},
  addr:{street:"", city:"", state:""},

};

var GOALS=[
  {id:"hold", name:"Hold", desc:"Buy it, rent it, keep it", live:true},
  {id:"sell", name:"Sell", desc:"Buy it, improve it, sell it", live:true},
  {id:"brrrr", name:"Hold after building value", desc:"BRRRR — recycle your cash and keep the property", live:true},
  {id:"build", name:"Build", desc:"Ground-up on land you have or will buy", live:true},
  {id:"entitle", name:"Entitle only", desc:"Get land approved, then sell the approval", live:true},
  {id:"unsure", name:"Not sure yet", desc:"Show me what this property could be", live:true, dual:true}
];
var ASSETS=[
  {id:"sf", name:"Single family", desc:"1 unit — house, condo, townhome", live:true},
  {id:"smf", name:"Small multifamily", desc:"2–20 units", live:true},
  {id:"lmf", name:"Large multifamily", desc:"20+ units · agency-style underwriting", live:true},
  {id:"ret", name:"Retail / Industrial", desc:"Lease-based commercial · NNN", live:true},
  {id:"mix", name:"Mixed-use", desc:"Blend of components", live:false, wave:"Wave 3"}
];

/* defaults seeded "from data" (demo values, source-tagged in UI) */
var D = {
  price:225000, rehabScope:"moderate", rehab:38000, arv:295000, rent:2200, units:1, beds:"b3",
  downPct:25, ratePct:7.0, selfManage:false, taxes:2400, insurance:1500, financeRehab:false,
  holdMonths:6, loanType:"hard", refiLtv:75, refiRatePct:7.25, seasonMonths:6, sqft:2400, rentPsf:16, hardPsf:165, salePsf:310, rentTotal:2600, softPct:20, buildMonths:12, exitMode:true, entBudget:120000, entMonths:18, confidence:"likely", exitValue:1350000, optionMode:false
};
var BR_RENTS={ st:{label:"Studio", rent:1150}, b1:{label:"1 BR", rent:1300}, b2:{label:"2 BR", rent:1650}, b3:{label:"3 BR", rent:2200}, b4:{label:"4 BR", rent:2600} };
var REHAB_SCOPES={ light:{label:"Cosmetic", amt:16000, psf:"$14/SF"}, moderate:{label:"Moderate", amt:38000, psf:"$34/SF"}, heavy:{label:"Heavy", amt:78000, psf:"$70/SF"} };

/* ---------------- engines ---------------- */
function rentalEngine(i,t){
  var closing=Math.max(i.price*0.03,3500);
  var loanBase=i.price*(1-i.downPct/100);
  var points=loanBase*0.01;
  var ltc=0.85;
  var loan=i.financeRehab? loanBase+i.rehab*ltc : loanBase;
  var allIn=i.price+i.rehab+closing+points;
  var forcedEq=i.arv-allIn;
  var units=i.units||1;
  var gsr=i.rent*units*12;
  var isLmf=(S.asset==="lmf");
  var vacPct=isLmf?7:5, egi=gsr*(1-vacPct/100);
  var r=i.ratePct/100/12, n=30*12;
  var pi=loan<=0?0:(r===0?loan/n:loan*r/(1-Math.pow(1+r,-n)));
  var debt=pi*12;
  var pmPct=i.selfManage?0:(isLmf?4:8);
  var payroll=isLmf&&units>40? units*1150:0;
  var opex=i.taxes+i.insurance+(pmPct/100*egi)+(0.05*gsr)+(0.05*gsr)+payroll;
  var noi=egi-opex, acf=noi-debt, mcf=acf/12;
  var cashIn=(i.price*i.downPct/100)+closing+points+(i.financeRehab? i.rehab*(1-ltc): i.rehab);
  var m={
    mcf:mcf, dscr:debt? noi/debt:99,
    coc:cashIn? acf/cashIn*100:0,
    yoc:allIn? noi/allIn*100:0,
    cap:i.price? noi/i.price*100:0,
    feq:allIn? forcedEq/allIn*100:0,
    cfUnit:mcf/units, onePct:i.price? i.rent/i.price*100:0,
    noi:noi, egi:egi, gsr:gsr, opex:opex, debt:debt, acf:acf,
    allIn:allIn, cashIn:cashIn, forcedEq:forcedEq, loan:loan, closing:closing, points:points, pi:pi, units:units
  };
  /* gates */
  var dscrTgt=isLmf? Math.max(t.dscr,1.25): t.dscr;
  var gates=[
    {id:"dscr", name:"DSCR", val:m.dscr, tgt:dscrTgt, pass:m.dscr>=dscrTgt, fmt:function(v){return v.toFixed(2);}},
    {id:"mcf", name:"Monthly cash flow", val:m.mcf, tgt:t.mcf, pass:m.mcf>=t.mcf, fmt:usd0}
  ];
  if(isLmf){ var dy=m.loan? m.noi/m.loan*100:99;
    gates.push({id:"dy", name:"Debt yield", val:dy, tgt:8, pass:dy>=8, fmt:pct1}); m.debtYield=dy; }
  /* scored, per §3.2 */
  function lerp(v,zero,full){ if(full===zero) return v>=full?1:0; var x=(v-zero)/(full-zero); return Math.max(0,Math.min(1,x)); }
  var cap0=S.marketCap;
  var sc=[
    {id:"coc", name:"Cash-on-cash", w:35, pts:35*lerp(m.coc,2,t.coc), val:m.coc, tgt:t.coc, fmt:pct1, gloss:"Every $1 you put in earns "+(m.coc/100).toFixed(2).replace("0.","")+"¢ a year — your target is "+t.coc+"¢."},
    {id:"yoc", name:"Yield-on-cost vs market", w:25, pts:25*lerp(m.yoc,cap0-0.5,cap0+t.yocSpread), val:m.yoc, tgt:cap0+t.yocSpread, fmt:pct1, gloss:"Return on everything you spend, vs a "+cap0.toFixed(1)+"% metro cap rate."},
    {id:"cfu", name:"Cash flow per unit", w:20, pts:20*lerp(m.cfUnit,0,t.cfUnit), val:m.cfUnit, tgt:t.cfUnit, fmt:usd0, gloss:"Monthly cushion each unit leaves after all bills and the loan."},
    {id:"feq", name:"Forced equity", w:20, pts:20*lerp(m.feq,0,t.feq), val:m.feq, tgt:t.feq, fmt:pct1, gloss:"Value you create on day one: worth after repairs vs everything it costs you."}
  ];
  var score=Math.round(sc.reduce(function(a,x){return a+x.pts;},0));
  return {kind:"hold", m:m, gates:gates, scored:sc, score:score, advisory:{onePct:m.onePct}};
}

function amort(loan, ratePct, yrs){
  var r=ratePct/100/12, n=yrs*12;
  return loan<=0?0:(r===0? loan/n : loan*r/(1-Math.pow(1+r,-n)));
}
function lerpN(v,zero,full){ if(full===zero) return v>=full?1:0; var x=(v-zero)/(full-zero); return Math.max(0,Math.min(1,x)); }

function brrrrEngine(i,t){
  var closing=Math.max(i.price*0.03,3500);
  var bridge=(i.price+i.rehab)*0.85, pts=bridge*0.02;
  var season=i.seasonMonths||6;
  var carryMo=(i.taxes+i.insurance)/12 + bridge*0.11/12;
  var cashIn=(i.price+i.rehab)-bridge + closing + pts + carryMo*season;
  var refiLoan=i.arv*(i.refiLtv||75)/100, refiCosts=refiLoan*0.01;
  var cashOut=Math.max(0, refiLoan-bridge-refiCosts);
  var cashLeft=Math.max(0, cashIn-cashOut);
  var units=i.units||1, gsr=i.rent*units*12, egi=gsr*0.95;
  var opex=i.taxes+i.insurance+0.08*egi+0.10*gsr;
  var noi=egi-opex, pi=amort(refiLoan, i.refiRatePct||7.25, 30), debt=pi*12;
  var acf=noi-debt, mcf=acf/12, dscr=debt? noi/debt:99;
  var coc=cashLeft>500? acf/cashLeft*100 : (acf>0? 999:0);
  var eqCap=i.arv? (i.arv-refiLoan)/i.arv*100:0;
  var leftPct=cashIn? cashLeft/cashIn*100:0;
  var m={cashIn:cashIn, cashOut:cashOut, cashLeft:cashLeft, refiLoan:refiLoan, bridge:bridge,
    noi:noi, egi:egi, gsr:gsr, opex:opex, debt:debt, acf:acf, mcf:mcf, dscr:dscr, coc:coc, eqCap:eqCap, leftPct:leftPct,
    pi:pi, units:units, allIn:i.price+i.rehab+closing+pts, forcedEq:i.arv-(i.price+i.rehab+closing+pts)};
  var gates=[
    {id:"dscr", name:"Post-refi DSCR", val:dscr, tgt:Math.max(t.dscr,1.20), pass:dscr>=Math.max(t.dscr,1.20), fmt:function(v){return v.toFixed(2);}},
    {id:"mcf", name:"Post-refi cash flow", val:mcf, tgt:0, pass:mcf>=0, fmt:usd0}
  ];
  var sc=[
    {id:"left", name:"Cash left in deal", w:35, pts:35*lerpN(60-leftPct,0,50), val:cashLeft, tgt:cashIn*0.10, fmt:usd0,
     gloss:"The BRRRR goal: pull your money back out at the refi. Full marks at 10% or less left in."},
    {id:"coc", name:"Post-refi cash-on-cash", w:35, pts:35*lerpN(Math.min(coc,60),4,12), val:Math.min(coc,999), tgt:12, fmt:function(v){return v>=999?"\u221e":pct1(v);},
     gloss:"Return on whatever cash stays in the deal after the refinance."},
    {id:"eq", name:"Equity capture", w:30, pts:30*lerpN(eqCap,10,25), val:eqCap, tgt:25, fmt:pct1,
     gloss:"How much of the finished value you keep above the new loan."}
  ];
  return {kind:"brrrr", m:m, gates:gates, scored:sc, score:Math.round(sc.reduce(function(a,x){return a+x.pts;},0)), advisory:{}};
}

function buildEngine(i,t){
  var land=i.price, sf=i.sqft||1;
  var hard=sf*i.hardPsf, soft=hard*(i.softPct||20)/100, cont=(hard+soft)*0.075;
  var closing=Math.max(land*0.02,2500), months=i.buildMonths||12;
  var budget=land+hard+soft+cont+closing;
  var cloan=budget*0.70, interest=cloan*0.095*(months/12)*0.55;
  var TDC=budget+interest, cashIn=TDC-cloan;
  var m={TDC:TDC, cashIn:cashIn, hard:hard, soft:soft, cont:cont, interest:interest, cloan:cloan, sf:sf};
  var gates, sc;
  if(i.exitMode){ /* SELL (merchant build) */
    var gross=sf*i.salePsf, sellCost=gross*0.05;
    var profit=gross-TDC-sellCost;
    var margin=TDC? profit/TDC*100:0, roi=cashIn? profit/cashIn*100:0;
    var totMonths=months+(i.sellMonths||4), ann=roi*12/totMonths, em=cashIn? (cashIn+profit)/cashIn:0;
    Object.assign(m,{gross:gross, sellCost:sellCost, profit:profit, margin:margin, roi:roi, em:em, ann:ann});
    gates=[{id:"profit", name:"Development profit", val:profit, tgt:0, pass:profit>=0, fmt:usd0}];
    sc=[
      {id:"margin", name:"Profit margin on cost", w:40, pts:40*lerpN(margin,5,15), val:margin, tgt:15, fmt:pct1, gloss:"Profit vs total development cost — the buffer against overruns and a soft market."},
      {id:"roi", name:"ROI on equity", w:30, pts:30*lerpN(roi,10,30), val:roi, tgt:30, fmt:pct1, gloss:"Profit vs the cash equity the stack requires."},
      {id:"em", name:"Equity multiple", w:15, pts:15*lerpN(em,1.1,1.5), val:em, tgt:1.5, fmt:function(v){return v.toFixed(2)+"\u00d7";}, gloss:"Total cash back vs cash in."},
      {id:"ann", name:"Annualized return", w:15, pts:15*lerpN(ann,12,35), val:ann, tgt:35, fmt:pct1, gloss:"What the return works out to per year including sell-out time."}
    ];
  } else { /* HOLD: build → stabilize → refi */
    var noi=(i.rentTotal||0)*12*0.60;
    var devYield=TDC? noi/TDC*100:0, spread=devYield-S.marketCap;
    var value=noi/(S.marketCap/100), refiLoan=value*0.70;
    var cashLeft=Math.max(0,cashIn-Math.max(0,refiLoan-cloan));
    var pi=amort(refiLoan, i.ratePct||7, 30), debt=pi*12, dscr=debt? noi/debt:99, cf=noi-debt;
    var devProfit=value-TDC;
    Object.assign(m,{noi:noi, devYield:devYield, spread:spread, value:value, refiLoan:refiLoan, cashLeft:cashLeft, dscr:dscr, cf:cf, devProfit:devProfit, pi:pi});
    gates=[
      {id:"yield", name:"Development yield", val:devYield, tgt:S.marketCap+0.75, pass:devYield>=S.marketCap+0.75, fmt:pct1},
      {id:"dscr", name:"Stabilized DSCR", val:dscr, tgt:1.20, pass:dscr>=1.20, fmt:function(v){return v.toFixed(2);}}
    ];
    sc=[
      {id:"spread", name:"Development spread", w:35, pts:35*lerpN(spread,0,1.5), val:spread, tgt:1.5, fmt:function(v){return v.toFixed(2)+" pts";}, gloss:"Yield-on-cost above the market cap rate — the reason to build instead of buy."},
      {id:"profit", name:"Value created", w:35, pts:35*lerpN(TDC?devProfit/TDC*100:0,0,20), val:devProfit, tgt:TDC*0.20, fmt:usd0, gloss:"Stabilized value vs everything it costs to build."},
      {id:"left", name:"Cash left after refi", w:30, pts:30*lerpN(cashIn? (100-cashLeft/cashIn*100):0,40,90), val:cashLeft, tgt:cashIn*0.10, fmt:usd0, gloss:"How much equity the refinance returns to you at stabilization."}
    ];
  }
  return {kind:"build", m:m, gates:gates, scored:sc, score:Math.round(sc.reduce(function(a,x){return a+x.pts;},0)), advisory:{}};
}

function entitleEngine(i,t){
  var land=i.price, budget=i.entBudget||0, months=i.entMonths||18;
  var conf=i.confidence||"likely", factor= conf==="byright"?0.9: conf==="likely"?0.6:0.35;
  var closing=Math.max(land*0.02,2000);
  var carry=land*0.011/12*months + 300*months;
  var totalIn=land+budget+carry+closing;
  var exit=i.exitValue||0, sellCost=exit*0.04;
  var margin=exit-totalIn-sellCost;
  var mult=totalIn? (totalIn+margin)/totalIn:0;
  var ann=totalIn? margin/totalIn*100*(12/months):0;
  var raPct=totalIn? margin*factor/totalIn*100:0;
  var floorPct=totalIn? (land*0.9-totalIn)/totalIn*100:0;
  var m={totalIn:totalIn, carry:carry, margin:margin, mult:mult, ann:ann, raPct:raPct, floorPct:floorPct, factor:factor, exit:exit, sellCost:sellCost, budget:budget};
  var gates=[{id:"margin", name:"Entitlement margin", val:margin, tgt:0, pass:margin>=0, fmt:usd0}];
  var sc=[
    {id:"mult", name:"Cash multiple", w:35, pts:35*lerpN(mult,1.1,2.0), val:mult, tgt:2.0, fmt:function(v){return v.toFixed(2)+"\u00d7";}, gloss:"Entitlement risk demands venture-like returns — 2\u00d7 is the bar."},
    {id:"ann", name:"Annualized return", w:25, pts:25*lerpN(ann,8,25), val:ann, tgt:25, fmt:pct1, gloss:"Margin per year of entitlement timeline — time is the real cost here."},
    {id:"ra", name:"Risk-adjusted margin", w:25, pts:25*lerpN(raPct,0,30), val:raPct, tgt:30, fmt:pct1, gloss:"Margin haircut by approval odds ("+conf.replace("byright","by-right")+" = \u00d7"+factor+")."},
    {id:"floor", name:"Downside floor", w:15, pts:15*lerpN(floorPct,-40,-10), val:floorPct, tgt:-10, fmt:pct1, gloss:"If denied: resell unentitled at ~90% of your land basis — how whole do you get?"}
  ];
  return {kind:"entitle", m:m, gates:gates, scored:sc, score:Math.round(sc.reduce(function(a,x){return a+x.pts;},0)), advisory:{}};
}

function retailEngine(i,t){
  var sf=i.sqft||1, closing=Math.max(i.price*0.025,4000);
  var loanBase=i.price*(1-i.downPct/100), points=loanBase*0.01;
  var allIn=i.price+i.rehab+closing+points;
  var gsr=sf*i.rentPsf, egi=gsr*0.90;                 /* 10% vacancy/credit */
  var opex=0.03*egi + 1.0*sf;                          /* NNN: mgmt + TI/LC reserve */
  var noi=egi-opex;
  var pi=amort(loanBase, i.ratePct, 25), debt=pi*12;
  var acf=noi-debt, mcf=acf/12, dscr=debt? noi/debt:99;
  var cashIn=(i.price*i.downPct/100)+closing+points+i.rehab;
  var coc=cashIn? acf/cashIn*100:0, yoc=allIn? noi/allIn*100:0;
  var feq=allIn? (i.arv-allIn)/allIn*100:0;
  var retCap=6.75;
  var m={gsr:gsr, egi:egi, opex:opex, noi:noi, debt:debt, acf:acf, mcf:mcf, dscr:dscr, coc:coc, yoc:yoc,
    feq:feq, allIn:allIn, cashIn:cashIn, pi:pi, loan:loanBase, units:1, forcedEq:i.arv-allIn, psf:i.price/sf};
  var gates=[
    {id:"dscr", name:"DSCR", val:dscr, tgt:1.30, pass:dscr>=1.30, fmt:function(v){return v.toFixed(2);}},
    {id:"mcf", name:"Monthly cash flow", val:mcf, tgt:0, pass:mcf>=0, fmt:usd0}
  ];
  var sc=[
    {id:"yoc", name:"Yield-on-cost vs retail cap", w:30, pts:30*lerpN(yoc,retCap-0.5,retCap+1.0), val:yoc, tgt:retCap+1.0, fmt:pct1, gloss:"Return on total basis vs a "+retCap+"% commercial cap rate."},
    {id:"coc", name:"Cash-on-cash", w:30, pts:30*lerpN(coc,3,8), val:coc, tgt:8, fmt:pct1, gloss:"Annual cash flow vs the cash you put in."},
    {id:"feq", name:"Forced equity", w:25, pts:25*lerpN(feq,0,15), val:feq, tgt:15, fmt:pct1, gloss:"Stabilized value vs your all-in basis."},
    {id:"cf", name:"Cash flow cushion", w:15, pts:15*lerpN(mcf,0,3000), val:mcf, tgt:3000, fmt:usd0, gloss:"Monthly cushion after the reserve for re-tenanting costs."}
  ];
  return {kind:"hold", m:m, gates:gates, scored:sc, score:Math.round(sc.reduce(function(a,x){return a+x.pts;},0)), advisory:{onePct:0}};
}
function flipEngine(i,t){
  var closing=Math.max(i.price*0.03,3500);
  var hard= i.loanType==="hard";
  var ltc=0.85, rate= hard?11:8.5, ptsPct= hard?2:1;
  var loan= hard? (i.price+i.rehab)*ltc : i.price*0.8;
  var points=loan*ptsPct/100;
  var months=i.holdMonths||6;
  var interest=loan*(rate/100)*(months/12);
  var carry=(i.taxes+i.insurance)/12*months + 150*months;
  var allIn=i.price+i.rehab+closing+points;
  var sellCost=i.arv*0.07;
  var profit=i.arv-allIn-carry-interest-sellCost;
  var cashIn=Math.max(allIn-loan,0)+carry;
  var roi=cashIn? profit/cashIn*100:0;
  var annRoi=roi*12/months;
  var margin=i.arv? profit/i.arv*100:0;
  var mao=0.70*i.arv-i.rehab;
  var m={profit:profit, roi:roi, annRoi:annRoi, margin:margin, mao:mao, allIn:allIn, cashIn:cashIn,
    carry:carry, interest:interest, sellCost:sellCost, loan:loan, closing:closing, points:points};
  var gates=[{id:"profit", name:"Net profit", val:profit, tgt:0, pass:profit>=0, fmt:usd0}];
  function lerp(v,zero,full){ var x=(v-zero)/(full-zero); return Math.max(0,Math.min(1,x)); }
  var sc=[
    {id:"margin", name:"Profit margin", w:40, pts:40*lerp(margin,5,t.margin), val:margin, tgt:t.margin, fmt:pct1, gloss:"Profit as a share of the sale price — the buffer if anything slips."},
    {id:"roi", name:"ROI on cash", w:30, pts:30*lerp(roi,10,t.roi), val:roi, tgt:t.roi, fmt:pct1, gloss:"Profit vs the cash you actually put in."},
    {id:"ann", name:"Annualized ROI", w:15, pts:15*lerp(annRoi,15,50), val:annRoi, tgt:50, fmt:pct1, gloss:"What the return works out to per year at this hold length."},
    {id:"disc", name:"Buy discount (70% rule)", w:15, pts:15*lerp(mao-i.price,-(0.1*i.arv),0), val:i.price, tgt:mao, fmt:usd0, gloss:"Classic flip check: pay no more than 70% of ARV minus rehab ("+usd0(mao)+")."}
  ];
  var score=Math.round(sc.reduce(function(a,x){return a+x.pts;},0));
  return {kind:"sell", m:m, gates:gates, scored:sc, score:score, advisory:{}};
}

function runEngine(kind, inputs, targets){
  if(kind==="sell") return flipEngine(inputs,targets);
  if(kind==="brrrr") return brrrrEngine(inputs,targets);
  if(kind==="build") return buildEngine(inputs,targets);
  if(kind==="entitle") return entitleEngine(inputs,targets);
  if(S.asset==="ret") return retailEngine(inputs,targets);
  return rentalEngine(inputs,targets);
}
function verdictOf(res, inputs, targets, kind){
  var gatesPass=res.gates.every(function(g){return g.pass;});
  var v, msg;
  var solvedPrice=solveMaxPrice(kind, inputs, targets);
  var fixable = solvedPrice!==null && solvedPrice >= inputs.price*0.90;
  if(gatesPass && res.score>=70){ v="GO"; msg="Clears your gates and scores "+res.score+"/100 against your targets — worth an offer."; }
  else if(gatesPass && res.score>=45){ v="PURSUE"; msg="No dealbreakers, but only "+res.score+"/100 against your targets — pursue if you can improve the terms below."; }
  else if(!gatesPass && fixable){ v="PURSUE"; msg="A dealbreaker at this price — but the fix is within 10% of asking. Negotiate before you walk."; }
  else { v="NO-GO"; msg = gatesPass? "Scores "+res.score+"/100 — too far from your targets as structured." : "Fails a hard gate, and the fix sits more than 10% below asking."; }
  return {v:v, msg:msg, solvedPrice:solvedPrice};
}

/* bisection: max price where gates pass and score>=70 */
function passesAll(kind, inputs, targets, price){
  var i=Object.assign({},inputs,{price:price});
  var r=runEngine(kind,i,targets);
  return r.gates.every(function(g){return g.pass;}) && r.score>=70;
}
function solveMaxPrice(kind, inputs, targets){
  if(passesAll(kind,inputs,targets,inputs.price)) {
    var lo=inputs.price, hi=inputs.price*2;
    if(passesAll(kind,inputs,targets,hi)) return hi;
    for(var k=0;k<40;k++){var mid=(lo+hi)/2; if(passesAll(kind,inputs,targets,mid)) lo=mid; else hi=mid;}
    return Math.floor(lo/100)*100;
  }
  if(!passesAll(kind,inputs,targets,1000)) return null;
  var lo2=1000, hi2=inputs.price;
  for(var k2=0;k2<40;k2++){var mid2=(lo2+hi2)/2; if(passesAll(kind,inputs,targets,mid2)) lo2=mid2; else hi2=mid2;}
  return Math.floor(lo2/100)*100;
}
function solveMinRent(inputs,targets,kind){
  kind=kind||"hold";
  var t=function(rent){ var i=Object.assign({},inputs,{rent:rent}); var r=runEngine(kind,i,targets);
    return r.gates.every(function(g){return g.pass;}) && r.score>=70; };
  if(t(inputs.rent)) return null;
  if(!t(inputs.rent*3)) return null;
  var lo=inputs.rent, hi=inputs.rent*3;
  for(var k=0;k<36;k++){var mid=(lo+hi)/2; if(t(mid)) hi=mid; else lo=mid;}
  return Math.ceil(hi/5)*5;
}
function solveMaxRehab(kind,inputs,targets){
  var t=function(rh){ var i=Object.assign({},inputs,{rehab:rh}); var r=runEngine(kind,i,targets);
    return r.gates.every(function(g){return g.pass;}) && r.score>=70; };
  if(!t(0)) return null;
  if(t(inputs.rehab)) return null;
  var lo=0, hi=inputs.rehab;
  for(var k=0;k<36;k++){var mid=(lo+hi)/2; if(t(mid)) lo=mid; else hi=mid;}
  return Math.floor(lo/500)*500;
}

/* ---------------- financing readiness (educational) ---------------- */
function readiness(kind, res, inputs){
  var p=S.profile, m=res.m, out=[];
  var cashNeed = m.cashIn!==undefined? m.cashIn : m.totalIn;
  function level(ratio){ return ratio>=1? "ready" : ratio>=0.8? "almost" : "build"; }
  if(kind==="brrrr"){
    var hb=level(p.cash/cashNeed);
    out.push({name:"Bridge / hard money (phase 1)", lvl:hb, note: hb==="ready"?"Gap equity, points and seasoning carry all fit your stated cash."
      : hb==="almost"?"Typically wants ~"+usd0(Math.max(cashNeed-p.cash,0))+" more for the bridge phase.":"Cash on hand is below the typical bridge-phase requirement."});
    var dr = m.dscr>=1.2? level(Math.min(p.cash/cashNeed,1)) : "build";
    out.push({name:"DSCR refinance (phase 2)", lvl:dr, note: m.dscr>=1.2? "Post-refi DSCR tracks with typical refi criteria at your chosen LTV.":"Post-refi DSCR is under 1.20 — lower the refi LTV or improve rent before this typically clears."});
  } else if(kind==="build"){
    var cb=level(p.cash/cashNeed);
    if(p.deals===0 && cb!=="build") cb="almost";
    out.push({name:"Construction loan", lvl:cb, note: cb==="ready"?"Equity requirement and typical experience bar both track."
      : cb==="almost"?(p.deals===0?"Equity tracks, but first-time builders typically see lower leverage and a completion guaranty — budget cushion.":"Typically wants ~"+usd0(Math.max(cashNeed-p.cash,0))+" more equity.")
      :"Stated cash is well below the ~30% equity construction lenders typically require."});
  } else if(kind==="entitle"){
    var eb=level(p.cash/cashNeed);
    out.push({name:"Land / entitlement financing", lvl:eb, note: eb==="ready"?"Most entitlement plays run on cash or land loans at low leverage — your stated cash covers this one."
      : eb==="almost"?"Close — an option structure could cap your exposure below your cash on hand.":"Consider optioning instead of buying: caps exposure at the option fee + pursuit costs."});
  } else if(kind==="hold"){
    var credOK = p.credit==="excellent"||p.credit==="good";
    var conv = credOK? level(p.cash/cashNeed) : "build";
    out.push({name:"Conventional", lvl:conv, note: conv==="ready"? "Your profile tracks with typical conventional criteria for a deal this size."
      : conv==="almost"? "Typically wants about "+usd0(Math.max(cashNeed-p.cash,0))+" more in cash than your profile shows."
      : credOK? "Cash on hand is well below what a deal this size typically requires — reserve-building track suggested."
      : "Conventional lending typically requires a stronger credit band — the Academy credit-building track maps the steps."});
    var dscrOK = m.dscr>=1.20;
    var dl = !dscrOK? "build" : level(p.cash/cashNeed);
    out.push({name:"DSCR loan", lvl:dl, note: !dscrOK? "The deal itself is below the 1.20 DSCR these products typically require — see the price lever above."
      : dl==="ready"? "Deal DSCR and your liquidity both track with typical DSCR-lender criteria."
      : dl==="almost"? "Deal qualifies on DSCR; typically wants ~"+usd0(Math.max(cashNeed-p.cash,0))+" more liquidity."
      : "Deal qualifies on DSCR, but liquidity is the gap — here's the reserve path."});
  } else {
    var hm = level(p.cash/cashNeed);
    if(p.deals===0 && hm==="ready") hm="almost";
    out.push({name:"Hard money / bridge", lvl:hm, note: hm==="ready"? "Points, carry and the equity gap all sit inside your stated cash."
      : hm==="almost"? (p.deals===0? "Cash tracks, but first-time flippers typically see lower leverage — budget extra cushion.":"Typically wants ~"+usd0(Math.max(cashNeed-p.cash,0))+" more cash for points and carry.")
      : "Cash on hand is below typical points + carry + equity for this flip."});
  }
  /* DeFi — honest collateral math */
  var ltv=0.60, support=p.wallet*ltv;
  var dl2 = support>=cashNeed? "ready" : support>=cashNeed*0.25? "almost" : "build";
  var liqDrop=Math.round((1-0.60/0.85)*100); /* stress vs typical liq threshold */
  var defiNote = dl2==="ready"? "Your connected wallet would typically support the full "+usd0(cashNeed)+" cash need at a conservative 60% LTV."
    : dl2==="almost"? "Your wallet would typically support ~"+usd0(support)+" of the "+usd0(cashNeed)+" need — gap-closing paths in the Academy."
    : "Typical crypto-collateralized structures would want ~"+usd0(Math.ceil(cashNeed/ltv/1000)*1000)+" posted for this cash need. At your current earn pace: typically ready in ~7 months.";
  out.push({name:"DeFi (crypto-collateralized)", lvl:dl2, note:defiNote, defi:true, drop:liqDrop});
  return {rows:out, cashNeed:cashNeed};
}

/* ---------------- questions ---------------- */
function questionsFor(goal){
  var q=[
    {id:"addr", t:"Where is it?", help:"Street, city and state. We’ll pull the county record, rent data and tax basis for this exact parcel.",
     type:"address"},
    {id:"price", t:"What's the asking price?", help:"Or the offer you have in mind — you can test other prices on the results screen.",
     type:"money", src:"Listing data · demo", key:"price"},
    {id:"rehab", t:"How much work does it need?", help:"Pick the scope and we'll estimate from real supplier pricing. Adjust the number if you have bids.",
     type:"rehab", src:"Covington supplier pricing · Jun 2026", key:"rehab",
     explain:"Cosmetic = paint, floors, fixtures. Moderate = kitchen/baths + systems touch-ups. Heavy = full gut or additions."},
    {id:"arv", t:"What will it be worth fixed up?", help:"The after-repair value. We've estimated from nearby sales — override it if you know better.",
     type:"money", src:"Comp estimate · ±8%", key:"arv",
     explain:"ARV (after-repair value) is what similar, already-renovated homes nearby sell for. It anchors your equity and your exit."}
  ];
  if(S.asset==="ret"){
    /* retail/industrial swaps residential questions */
    q=q.filter(function(x){return x.id!=="rehab"&&x.id!=="arv";});
    q.push({id:"rehab", t:"TI / improvement budget", help:"Tenant improvements and building work to stabilize it.", type:"money", src:"Covington supplier pricing · Jun 2026", key:"rehab"});
    q.push({id:"arv", t:"Stabilized value", help:"What it\u2019s worth leased at market.", type:"money", src:"Cap-rate valuation · demo", key:"arv"});
    q.push({id:"sqft", t:"Leasable square feet", help:"NRA — what tenants actually pay on.", type:"count2", key:"sqft", unit:"SF"});
    q.push({id:"psf", t:"Rent per square foot (NNN, yearly)", help:"Tenants cover taxes, insurance and CAM under NNN — this is your net rent.",
      type:"money", src:"Commercial comps · demo", key:"rentPsf",
      explain:"NNN means the tenant reimburses taxes, insurance and maintenance. Your main owner costs left: management and a reserve for re-tenanting (we budget both)."});
    q.push({id:"down", t:"How much are you putting down?", help:"Commercial lenders typically want 25–35%.", type:"pctseg", key:"downPct", opts:[25,30,35]});
    q.push({id:"rate", t:"Interest rate", help:"Commercial mortgage, 25-year amortization assumed.", type:"pct", src:"Rate table · this week", key:"ratePct"});
    return q;
  }
  if(S.asset==="lmf" && goal!=="sell"){
    q=q.filter(function(x){return true;});
    q.push({id:"units2", t:"How many units?", help:"20+ for this template.", type:"count2", key:"units", unit:"units"});
    q.push({id:"rent", t:"Average rent per unit", help:"Across the mix, post-renovation.", type:"money", src:"Metro rent data · demo", key:"rent"});
    q.push({id:"down", t:"How much are you putting down?", help:"Agency-style loans typically want 25–35% down.", type:"pctseg", key:"downPct", opts:[25,30,35]});
    q.push({id:"rate", t:"Interest rate", help:"Agency-style terms prefilled.", type:"pct", src:"Rate table · this week", key:"ratePct"});
    q.push({id:"taxes", t:"Annual property taxes", help:"Defaulted from the county\u2019s effective rate \u00d7 your price.", type:"money", src:"County rate \u00d7 your price", key:"taxes", smart:"tax"});
    q.push({id:"ins", t:"Annual insurance", help:"Per-unit metro average.", type:"money", src:"Metro $/unit table", key:"insurance", smart:"ins"});
    if(goal==="brrrr"){ q=q.concat(brrrrQs()); }
    return q;
  }
  if(goal!=="sell"){
    if(S.asset==="smf"){
      q.push({id:"mix", t:"What's the unit mix?", help:"Counts and post-renovation rent per unit type. Rents are prefilled by bedroom for this ZIP.",
        type:"unitmix", src:"HUD FMR + rent AVM by bedroom · demo",
        explain:"Rent moves more by bedroom count than by almost anything else, so we underwrite each type separately and roll them up."});
    } else {
      q.push({id:"rent", t:"What monthly rent can it get?", help:"Pick the bedroom count — the estimate updates from bedroom-level rent data. Override if you know better.",
        type:"bedrent", src:"HUD FMR + rent AVM by bedroom · demo", key:"rent",
        explain:"Use the post-renovation rent. If you're between numbers, screen with the lower one — deals should work on honest rent."});
    }
    q.push({id:"down", t:"How much are you putting down?", help:"Typical investor loans want 20–25% down.", type:"pctseg",
      key:"downPct", opts:[20,25,30], explain:"More down = smaller loan and safer DSCR, but more cash locked in the deal. The screener will show the tradeoff."});
    q.push({id:"rate", t:"Interest rate", help:"Today's typical 30-year investor rate is prefilled — edit if you've been quoted.",
      type:"pct", src:"Rate table · this week", key:"ratePct"});
    q.push({id:"mgmt", t:"Managing it yourself?", help:"Professional management typically runs 8% of collected rent.",
      type:"toggle", key:"selfManage", yes:"I'll self-manage", no:"Hire management"});
    q.push({id:"taxes", t:"Annual property taxes", help:"Not the seller’s bill — many states reassess at sale, so we start from the county’s effective rate × your price and check it against the last billed amount.",
      type:"money", src:"County rate 1.1% × your price · vs last bill", key:"taxes", smart:"tax",
      explain:"The seller’s current bill can be years stale. Our default = max(last billed amount, your price × county effective rate). If the two differ sharply, budget the higher one."});
    q.push({id:"ins", t:"Annual insurance", help:"Estimated from replacement cost × your state’s rate, adjusted for flood zone. A partner quote can replace this later.",
      type:"money", src:"Replacement cost × state rate · FEMA zone X", key:"insurance", smart:"ins",
      explain:"Heuristic: rebuild cost (sq ft × local build cost) × rate per $1,000, plus flood/wind loadings. Real quotes come from an embedded insurance partner at the proforma stage."});
    if(goal==="brrrr"){ q=q.filter(function(x){return x.id!=="down"&&x.id!=="frehab";}).concat(brrrrQs()); }
    else q.push({id:"frehab", t:"Financing the rehab?", help:"Renovation loans typically cover ~85% of the work; otherwise it's your cash.",
      type:"toggle", key:"financeRehab", yes:"Finance it", no:"Pay cash",
      explain:"Financing rehab keeps cash in your pocket but raises the loan and lowers DSCR. The screener runs the honest math either way."});
  } else {
    q.push({id:"hold", t:"How long will you hold it?", help:"Purchase to sale, in months. Most flips run 4–9.",
      type:"countseg", key:"holdMonths", opts:[4,6,9]});
    q.push({id:"loan", t:"How will you fund it?", help:"Hard money is typical for flips: faster, pricier. Prefilled at today's typical terms.",
      type:"loanseg", key:"loanType",
      explain:"Hard money (demo terms): ~11% + 2 points at 85% of price+rehab. Bank bridge: ~8.5% + 1 point at 80% of price."});
    q.push({id:"taxes", t:"Annual property taxes", help:"Carried while you hold it — defaulted from the county’s effective rate × your price, checked against the last billed amount.",
      type:"money", src:"County rate 1.1% × your price · vs last bill", key:"taxes", smart:"tax"});
    q.push({id:"ins", t:"Annual insurance", help:"Builder’s-risk style coverage while you renovate, from replacement cost × state rate.",
      type:"money", src:"Replacement cost × state rate", key:"insurance", smart:"ins"});
  }
  return q;
}

function commitMix(){
  var mx=S.inputs.unitMix, n=0, dollars=0;
  Object.keys(mx).forEach(function(k){ n+=mx[k].n; dollars+=mx[k].n*mx[k].rent; });
  S.inputs.units=Math.max(1,n);
  S.inputs.rent= n? dollars/n : 0; /* weighted avg feeds the canonical engine */
}
function smartTax(){ return Math.round(S.inputs.price*0.011/10)*10; }   /* county effective rate × YOUR price (demo 1.1%) */
function smartIns(){ return Math.round(Math.max(900, S.inputs.price*0.0058)/10)*10; } /* replacement-cost heuristic × state rate (demo) */

function brrrrQs(){
  return [
    {id:"refiltv", t:"Refinance at what LTV?", help:"Lenders typically refinance BRRRRs at 70–80% of the appraised value.",
     type:"pctseg", key:"refiLtv", opts:[70,75,80],
     explain:"Higher LTV pulls more cash out but raises the payment and lowers DSCR. 75% is the market norm."},
    {id:"refirate", t:"Refinance rate", help:"30-year DSCR-style loan on the finished property.", type:"pct", src:"Rate table · this week", key:"refiRatePct"},
    {id:"season", t:"Seasoning before the refi?", help:"Months you\u2019ll carry the bridge loan before refinancing.", type:"countseg", key:"seasonMonths", opts:[6,9,12],
     explain:"Most lenders want 6+ months of ownership before lending on the new appraised value. Every month adds carry cost."}
  ];
}

function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

function pickAsset(id){
  S.asset=id;
  S.inputs=Object.assign({},D);
  S.inputs.units=1; S.inputs.unitMix=null;
  if(id==="smf"){
    S.inputs.price=520000; S.inputs.rehab=90000; S.inputs.arv=680000; S.inputs.taxes=6800; S.inputs.insurance=4200;
    S.inputs.unitMix={st:{n:0,rent:1150}, b1:{n:2,rent:1300}, b2:{n:2,rent:1650}, b3:{n:0,rent:2200}, b4:{n:0,rent:2600}};
    commitMix();
  }
  if(id==="lmf"){
    Object.assign(S.inputs,{units:48, rent:1400, price:5800000, rehab:720000, arv:8200000, taxes:62000, insurance:38000, downPct:30});
  }
  if(id==="ret"){
    Object.assign(S.inputs,{sqft:12000, rentPsf:16, price:1900000, rehab:150000, arv:2500000, downPct:30, taxes:0, insurance:0});
  }
  if(S.goal==="build"){
    var hp = id==="ret"? {sqft:30000, hardPsf:135, salePsf:210, rentTotal:38000} :
             id==="lmf"? {sqft:42000, hardPsf:175, salePsf:265, rentTotal:78000} :
             id==="smf"? {sqft:9600, hardPsf:170, salePsf:250, rentTotal:14500} :
                         {sqft:2400, hardPsf:165, salePsf:310, rentTotal:2600};
    Object.assign(S.inputs,{price: id==="ret"?650000: id==="lmf"?1400000: id==="smf"?420000:120000,
      softPct:20, buildMonths: id==="sf"?8:14, exitMode:true}, hp);
  }
  S.touched={}; S.pf=null;
  S.qIndex=0; S.qs=questionsFor(S.goal==="unsure"?"hold":S.goal);
  if(S.goal==="unsure"){
    var sellQ=questionsFor("sell").filter(function(q){return q.id==="hold"||q.id==="loan";});
    S.qs=S.qs.concat(sellQ);
  }
  goQuestion();
}

  } else if(q.type==="unitmix"){
    var mx=S.inputs.unitMix;
    html+='<div class="sc-table" style="margin-bottom:12px">'+
      '<div class="sc-r h" style="grid-template-columns:1fr 1.2fr 1fr"><span>Type</span><span>Units</span><span>Rent /mo</span></div>';

function validateInputs(){

  if(S.goal==="entitle"){
    if(i.exitValue < i.price*0.8) put("exitv","Entitled value below the raw-land price — one of these is off.");
    return errs;
  }
  if(S.goal==="build"){
    if(!(i.hardPsf>=40 && i.hardPsf<=600)) put("hard","Hard cost outside $40–600/SF — check against supplier pricing.");
    if(i.exitMode && !(i.salePsf>i.hardPsf*0.8)) put("salepsf","Sale $/SF is below hard cost — that can\u2019t pencil; check both numbers.");
    return errs;
  }
  if(i.arv < i.price*0.8) put("arv","Finished value is 20%+ below your price — it should usually exceed cost basis.");
  if(i.rehab<0 || i.rehab>i.price*1.5) put("rehab","Improvement budget is over 150% of the price — double-check the scope.");
  if(S.goal!=="sell"){
    if(S.asset==="ret"){
      if(!(i.rentPsf>=4 && i.rentPsf<=80)) put("psf","NNN rent outside $4–80/SF — probably a typo.");

function robustness(kind,res,v){
  var i=S.inputs, t=S.targets, base=v.v;
  function vOf(mod){ var ii=Object.assign({},i,mod); var r=runEngine(kind,ii,t); return verdictOf(r,ii,t,kind).v; }

            kind==="entitle"? vOf({exitValue:i.exitValue*1.05}) :
            kind==="hold"? vOf({rentPsf:i.rentPsf+2}) : vOf({arv:i.arv*1.03});

  }
  if(kind==="entitle"){
    if(vOf({entMonths:i.entMonths+6, exitValue:i.exitValue*0.95})===base) return {tone:"ok", txt:"Holds even 6 months late and 5% under the exit value."};
    if(vOf({exitValue:i.exitValue*0.97})!==base) return {tone:"warn", txt:"Fragile — a 3% exit miss changes the verdict. Get real entitled-land comps first."};

      if(vOf({rentPsf:i.rentPsf-2})===base) return {tone:"ok", txt:"Holds even at $2/SF lower rent — cushion against a rollover."};

var TRADE_SPLIT=[["Demo & prep",5],["Framing & drywall",12],["Kitchen",20],["Bathrooms",15],["Flooring",10],["Paint & finish",8],["HVAC / electrical / plumbing",18],["Exterior & roof",7],["Contingency",5]];
function initProforma(){
  var i=S.inputs, kind=S.resultTab;
  var pf={kind:kind};
  pf.trades=TRADE_SPLIT.map(function(tr){ return {name:tr[0], amt:Math.round(i.rehab*tr[1]/100)}; });
  var rem=i.rehab-pf.trades.reduce(function(a,x){return a+x.amt;},0); pf.trades[pf.trades.length-1].amt+=rem;

  else pf.roll=[{label:(S.asset==="lmf"? "Avg unit":"Unit"), n:i.units||1, rent:Math.round(i.rent)}];
  pf.growth={rent:3.0, exp:2.5, appr:3.0};

function irr(cfs){
  function npv(r){ return cfs.reduce(function(a,c,t){ return a+c/Math.pow(1+r,t); },0); }
  var lo=-0.9, hi=3.0;
  if(npv(lo)*npv(hi)>0) return null;
  for(var k=0;k<80;k++){ var mid=(lo+hi)/2; (npv(lo)*npv(mid)<=0)? hi=mid: lo=mid; }
  return (lo+hi)/2*100;
}
function fiveYear(res){
  var i=S.inputs, m=res.m, g=S.pf.growth, kind=S.resultTab;
  var basis = kind==="brrrr"? Math.max(m.cashLeft,1) : m.cashIn;
  var loan = kind==="brrrr"? m.refiLoan : (m.loan||0);
  var rate = kind==="brrrr"? (i.refiRatePct||7.25) : i.ratePct;
  var termY = (S.asset==="ret")?25:30;
  var pmt=amort(loan,rate,termY), rM=rate/100/12;
  var yrs=[];
  var noi=m.noi, opex=m.opex, egi=m.egi;
  for(var y=1;y<=5;y++){
    if(y>1){ egi*=1+g.rent/100; opex*=1+g.exp/100; noi=egi-opex; }
    var bal = rM===0? loan-pmt*12*y : loan*Math.pow(1+rM,y*12)-pmt*(Math.pow(1+rM,y*12)-1)/rM;
    yrs.push({y:y, egi:egi, opex:opex, noi:noi, debt:pmt*12, cf:noi-pmt*12, bal:Math.max(bal,0)});
  }
  var value5 = (S.asset==="lmf"||S.asset==="ret")? yrs[4].noi/(S.marketCap/100) : i.arv*Math.pow(1+g.appr/100,5);
  var proceeds = value5*0.94 - yrs[4].bal;
  var cfs=[-basis]; for(var y2=0;y2<4;y2++) cfs.push(yrs[y2].cf); cfs.push(yrs[4].cf+proceeds);
  var totalBack=cfs.slice(1).reduce(function(a,c){return a+c;},0);
  return {yrs:yrs, value5:value5, proceeds:proceeds, irr:irr(cfs), em:basis? (totalBack)/basis:0, basis:basis, profit:totalBack-basis};
}

      if(r.key && S.inputs.unitMix){ S.inputs.unitMix[r.key].n=r.n; S.inputs.unitMix[r.key].rent=r.rent; }

      x.fillStyle=d.ok?"#00D19A":"#FF7A6B"; x.beginPath(); x.arc(96,y-9,9,0,7); x.fill();
      x.fillStyle="#F2F7F5"; x.font="600 30px Inter, sans-serif"; x.fillText(d.n, 126, y);
      x.fillStyle="#8FA6A0"; x.font="500 26px ui-monospace, monospace"; x.fillText(d.t, 126, y+34);
      y+=92;
    });
    /* lever */
    x.fillStyle="rgba(212,169,90,.10)"; rr(76,y-8,848,120,18); x.fill();
    x.strokeStyle="rgba(212,169,90,.5)"; x.lineWidth=2; rr(76,y-8,848,120,18); x.stroke();
    x.fillStyle="#D4A95A"; x.font="700 22px Inter, sans-serif"; x.fillText("WHAT WOULD CHANGE THE ANSWER", 102, y+28);
    x.fillStyle="#F2F7F5"; x.font="600 30px Inter, sans-serif";
    var lv = v.solvedPrice===null? "Income can\u2019t carry this one at any price" :
      v.solvedPrice>=S.inputs.price? "Works up to "+usd0(v.solvedPrice)+" — ceiling above asking" :
      "Works at "+usd0(v.solvedPrice)+" ("+((1-v.solvedPrice/S.inputs.price)*100).toFixed(1)+"% below asking)";
    x.fillText(lv, 102, y+72);
    /* footer */
    x.fillStyle="#5E7370"; x.font="600 24px Inter, sans-serif";
    x.fillText("buildorbusted.app", 80, 952);
    x.textAlign="right"; x.fillText("@buildorbusted", 924, 952); x.textAlign="left";
    x.fillStyle="#41544F"; x.font="400 15px Inter, sans-serif";
    x.fillText("Educational screening estimate — not investment, lending or legal advice.", 80, 980);
    var a=document.createElement("a");
    a.download="buildorbust-"+(S.addr.street||"deal").toLowerCase().replace(/[^a-z0-9]+/g,"-")+".png";
    a.href=cv.toDataURL("image/png"); a.click();
    toast("Card downloaded — post it, tag @buildorbusted");
  }catch(e){ toast("Share card needs a browser to render"); }
}
