document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ith a\n *   single text flow: reports, memos, letters, essays.\n * - EXPLICIT pagination: a fixed set of pre-paginated pages, one\n *   <section class=\"page\"> child per page. Use when the user asks for a\n *   specific page count, or the design implies one: a one-page resume, a\n *   two-sided flier, a poster, a certificate, a brochure — any richly\n *   laid-out document without a single text flow.\n * - If in doubt, ask the user as part of the build.\n *\n * PAGE SIZING — paper differs by country (letter vs A4), so the printed\n * sheet is not one fixed truth:\n * - FLOWING documents pin NO paper size: the print engine paginates\n *   onto the user's real paper, and the content reflows to it.\n * - EXPLICITLY PAGINATED documents print each page at a FIXED page box\n *   with overflow hidden — letter by default, size=\"a4\" for a clearly\n *   metric user, the user's chosen paper when they export. Design each\n *   page to FILL that box, fitting letter and A4 alike without overlap.\n * - width/height pin an explicit fixed size, ONLY when the user gives\n *   one.\n * Never write your own @page rule or hard-code paper dimensions in the\n * content.\n *\n * Sizing modes (attributes):\n *   (none)                      — portrait: flowing docs use the user's\n *           paper; explicitly paginated pages use the named size box\n *           (letter unless size=\"a4\")\n *   orientation=\"landscape\"     — the same, landscape\n *   width / height              — explicit fixed size, ONLY when the user\n *           gives one (e.g. width=\"22in\" height=\"30in\" for a 22×30\n *           poster): the page IS the design's size, printed at true\n *           dimensions (or scaled onto the user's paper at print time).\n *           Any absolute CSS length: px/in/mm/cm/pt/pc.\n * The component announces the chosen mode to the host app at runtime (a\n * meta tag it injects), so the print path can inject the user's true\n * paper size.\n *\n * On screen the document renders on a desk background: a flowing\n * document as one tall scrolling sheet (Google Docs' pageless view);\n * explicitly paginated documents as one card per page.\n *\n * EXPLICIT pagination usage:\n *   <style>doc-page:not(:defined){visibility:hidden}<\u002Fstyle>\n *   <doc-page>\n *     <section class=\"page\" id=\"p1\">…one page's design…<\u002Fsection>\n *     <section class=\"page\" id=\"p2\">…<\u002Fsection>\n *   <\u002Fdoc-page>\n *   <script src=\"doc-page.js\"><\\/script>\n * How the page box works, concretely: each .page prints as ONE full-bleed\n * sheet at a FIXED physical size — letter by default (set size=\"a4\" for\n * a clearly metric user), the user's chosen paper when they export —\n * with overflow hidden. Nothing scrolls and nothing reflows onto a next\n * sheet: content that misses the box is CLIPPED. Design each page to\n * FILL that page box, and to fit it — letter and A4 alike — without\n * overlap. Each page is a size container; don't size anything in\n * viewport units (they track the window, not the page), and never set\n * width or height on the .page section itself (the component sizes the\n * page box; an authored height like 100% is meaningless at print and is\n * overridden). The component owns the page box, the screen card chrome,\n * and the page breaks (never add your own break-before/after). Don't mix\n * .page sections with flowing content or header/footer slots in the same\n * document.\n *\n * FLOWING usage:\n *   <style>doc-page:not(:defined){visibility:hidden}<\u002Fstyle>\n *   <doc-page margin=\"0.75in\">\n *     <h1>Title<\u002Fh1>\n *     <p>…body…<\u002Fp>\n *   <\u002Fdoc-page>\n *   <script src=\"doc-page.js\"><\\/script>\n * There is no manual page-splitting — the browser's print engine\n * paginates at export. Standard break-hygiene rules (`break-inside:\n * avoid` on figures, code blocks, images and table rows; `orphans/\n * widows: 3`) are applied so paragraphs and groups split cleanly. On\n * screen and at print, headings default to `text-wrap: balance` and\n * body text to `text-wrap: pretty`; the defaults have zero specificity,\n * so any text-wrap you declare wins.\n *\n * Other attributes:\n *   size    — letter | a4 | legal (default letter). Flowing documents:\n *           preview proportion only — it does NOT pin their printed\n *           paper (the print dialog's paper governs); leave it alone\n *           there. Explicitly paginated documents: it sets the page box\n *           the cards and the pinned @page share (the export dialog's\n *           choice overrides both at print) — set size=\"a4\" for a\n *           clearly metric user. Scaled-fit: names the sheet the fit is\n *           computed against, same a4-for-metric-users advice.\n *   content-width / content-height — the design's own fixed dimensions\n *           (CSS lengths), for scaling a fixed-size design ONTO the\n *           named sheet: content lays out at exactly this size, and the\n *           component scales it to fit that sheet's printable area\n *           (centered horizontally, top-aligned; the export dialog\n *           re-fits to the user's actual paper choice where available).\n *           Both must be set; they do not change the page box. For pages\n *           WITHOUT running header/footer slots.\n *   margin  — printable inset on every page of a FLOWING document\n *           (default 0.75in); margin=\"0\" makes pages full-bleed.\n *           Explicitly paginated pages are always full-bleed.\n *\n * Running header/footer (flowing documents only): give an element\n * `slot=\"header\"` or `slot=\"footer\"` and it repeats on every printed\n * page via `position: fixed`. To keep body text from sliding under it,\n * the component prints inside a single-cell table whose <sc-raw-thead>/<sc-raw-tfoot>\n * are spacers sized to the header/footer height — browsers repeat\n * thead/tfoot on every page, so each sheet's content starts below the\n * header and ends above the footer. On scr        ? 'size: ' + this.pageWidth + ' ' + this.pageHeight + '; '\n        : this._contentFit()\n          ? 'size: ' + this.pageWidth + ' ' + this.pageHeight + '; '\n          : paginatedNow\n            ? 'size: ' + this.pageWidth + ' ' + this.pageHeight + '; '\n            : landscape\n              ? 'size: landscape; '\n              : '';\n      // WebKit never repeats the thead/tfoot spacers that carry a flowing\n      // document's vertical page margins (see WK_PRINT above), so pages\n      // after the first print edge-to-edge there. Carry the VERTICAL\n      // margins on @page for WebKit instead, and the shadow print CSS\n      // trims the first-page spacers by the same amount (.sheet.wk-print\n      // rules). Horizontal inset stays on the sheet's own padding in\n      // every engine. Blink keeps margin: 0 (a nonzero margin there\n      // re-opens the box Chrome draws its header furniture in). One cost,\n      // learned in testing: Safari's own date/URL headers are a USER\n      // dialog setting (\"Print headers and footers\") that renders in the\n      // margin area when room exists — margin: 0 only suppressed it by\n      // leaving no room, and no CSS controls it. The export dialog's\n      // Safari guide teaches turning the setting off for flowing\n      // documents. Explicitly paginated and fixed-size documents keep\n      // margin: 0 everywhere: their pages ARE the sheet.\n      const wkFlowing =\n        WK_PRINT && !paginatedNow && !this._trueSizePx() && !this._contentFit();\n      const marginDescriptor = wkFlowing\n        ? 'margin: ' + this.pageMargin + ' 0; '\n        : 'margin: 0; ';\n      // Shadow-internal marker (never serialized), kept in lockstep with\n      // the @page decision above: the print CSS trims the first-page\n      // spacers ONLY while @page actually carries the margins — a\n      // true-size or scaled-fit sheet keeps margin: 0 and must keep its\n      // spacers too. Re-synced here so attribute changes and pagination\n      // flips move both together.\n      if (this._sheet) this._sheet.classList.toggle('wk-print', wkFlowing);\n      tag.textContent =\n        '@page { ' + sizeDescriptor + marginDescriptor + '} ' +\n        '@media print { html, body { margin: 0 !important; padding: 0 !important; background: none !important; height: auto !important; overflow: visible !important; } ' +\n        'h1,h2,h3,h4,h5,h6 { break-after: avoid; } ' +\n        'figure,pre,blockquote,img,svg,tr { break-inside: avoid; } ' +\n        'p,li { orphans: 3; widows: 3; } ' +\n        '* { -webkit-print-color-adjust: exact; print-color-adjust: exact; ' +\n        'backdrop-filter: none !important; -webkit-backdrop-filter: none !important; } ' +\n        '*, *::before, *::after { animation-delay: -99s !important; animation-duration: .001s !important; ' +\n        'animation-iteration-count: 1 !important; animation-fill-mode: both !important; ' +\n        'animation-play-state: running !important; transition-duration: 0s !important; } }';\n    }\n\n    /** Typographic defaults for document text: balance headings, avoid\n     *  widowed/orphaned words in body copy (browsers without text-wrap\n     *  support drop the declarations). Zero-specificity via :where() so\n     *  any text-wrap authored on those elements wins; document-level so the\n     *  rules reach the slotted (light DOM) content — shadow styles can't.\n     *  data-omelette-injected marks the tag for the host editor to strip\n     *  at serialize, so it is never written back as authored source. */\n    _ensureTextWrapDefaults() {\n      if (document.getElementById('doc-page-text-wrap')) return;\n      const tag = document.createElement('style');\n      tag.id = 'doc-page-text-wrap';\n      tag.setAttribute('data-omelette-injected', '');\n      tag.textContent =\n        ':where(h1,h2,h3,h4,h5,h6){text-wrap:balance}' +\n        ':where(p,li,blockquote,figcaption){text-wrap:pretty}';\n      document.head.appendChild(tag);\n    }\n\n    /** Declares that this document owns its print CSS. The instant-PDF\n     *  export checks for the meta by NAME PRESENCE alone (content is\n     *  ignored) and skips its automatic print-CSS injections, so the\n     *  component's @page geometry is never overridden by a heuristic.\n     *  data-omelette-injected keeps it out of serialized source. */\n    _ensureOwnsPrintMeta() {\n      if (document.getElementById('doc-page-owns-print')) return;\n      const tag = document.createElement('meta');\n      tag.id = 'doc-page-owns-print';\n      tag.name = 'omelette-owns-print';\n      tag.content = 'true';\n      tag.setAttribute('data-omelette-injected', '');\n      document.head.appendChild(tag);\n    }\n\n    /** This page's valid true-size page box (explicit width AND height)\n     *  as [w, h] px ints, or null when the mode is off. */\n    _trueSizePx() {\n      if (\n        !safeLen(this.getAttribute('width'), null) ||\n        !safeLen(this.getAttribute('height'), null)\n      ) return null;\n      const w = Math.round(toPx(this.pageWidth));\n      const h = Math.round(toPx(this.pageHeight));\n      return w > 0 && h > 0 ? [w, h] : null;\n    }\n\n    /** True-size pages (explicit width AND height) also declare the page\n     *  box as the preview size: the in-app preview reads\n     *  meta[name=\"omelette-fixed-size\"] (content \"W,H\" in px ints) and\n     *  scales the sheet into view — without it an 18in poster previews at\n     *  true size with scrollbars. Never overrides an author-set meta\n     *  (only the component's own id is managed). The meta is page-global\n     *  while doc-page instances are not, so every sync recomputes the\n     *  page-wide owner — the first connected true-size doc-page — and a\n     *  non-true-size sibling's sync can never delete the owner's meta.\n     *  Removed when no true-size page remains (the owner's disconnect\n     *  re-syncs via any survivor) or when an author-set meta exists. */\n    _syncFixedSizeMeta() {\n      const id = 'doc-page-fixed-size';\n      const own = document.getElementById(id);\n      const authored = document.querySelector(\n        'meta[name=\"omelette-fixed-size\"]:not([data-omelette-injected])'\n      );\n      // The page-wide owner, not this instance: an upgraded true-size page\n      // anywhere in the document keeps the meta alive and sized.\n      let box = null;\n      for (const el of document.querySelectorAll('doc-page')) {\n        box = typeof el._trueSizePx === 'function' ? el._trueSizePx() : null;\n        if (box) break;\n      }\n      if (!box || authored) {\n        if (own) own.remove();\n        return;\n      }\n      const tag = own || document.createElement('meta');\n      tag.id = id;\n      tag.name = 'omelette-fixed-size';\n      tag.content = box[0] + ',' + box[1];\n      tag.setAttribute('data-omelette-injected', '');\n      if (!own) document.head.appendChild(tag);\n    }\n\n    /** This page's print-sizing mode: 'fixed' when an explicit width AND\n     *  height are authored (the page is the design's own size), else the\n     *  default paper in the authored orientation. */\n    _printSizingMode() {\n      if (this._trueSizePx()) return 'fixed';\n      const landscape =\n        (this.getAttribute('orientation') || '').trim().toLowerCase() ===\n        'landscape';\n      return landscape ? 'default-landscape' : 'default-portrait';\n    }\n\n    /** Announces the print-sizing mode to the host app:\n     *  meta[name=\"omelette-print-sizing\"] with content 'default-portrait',\n     *  'default-landscape', or 'fixed' (fixed pages also carry the\n     *  omelette-fixed-size meta with the page box in px). The export path\n     *  probes it to decide what true paper size to inject at print time —\n     *  in the default modes the component emits no paper size of its own.\n     *  Same page-global ownership rules as the fixed-size meta above:\n     *  first connected doc-page owns it, an authored meta is never\n     *  overridden, removed when no doc-page remains. */\n    _syncPrintSizingMeta() {\n      const id = 'doc-page-print-sizing';\n      const own = document.getElementById(id);\n      const authored = document.querySelector(\n        'meta[name=\"omelette-print-sizing\"]:not([data-omelette-injected])'\n      );\n      // A fixed page wins outright (mirroring the fixed-size loop above,\n      // so the two metas can never contradict each other in a mixed\n      // multi-page document); otherwise the first page's mode holds.\n      let mode = null;\n      for (const el of document.querySelectorAll('doc-page')) {\n        if (typeof el._printSizingMode !== 'function') continue;\n        const m = el._printSizingMode();\n        if (m === 'fixed') {\n          mode = m;\n          break;\n        }\n        if (mode === null) mode = m;\n      }\n      if (!mode || authored) {\n        if (own) own.remove();\n        return;\n      }\n      // A deck-stage that connected first injected its own meta and\n      // defers to any existing one — take it over, or the document ends\n      // up with two conflicting injected metas (a doc-page page is the\n      // document; the deck re-ensures its meta if every doc-page leaves).\n      const deckMeta = document.getElementById('deck-stage-print-sizing');\n      if (deckMeta) deckMeta.remove();\n      const tag = own || document.createElement('meta');\n      tag.id = id;\n      tag.name = 'omelette-print-sizing';\n      tag.content = mode;\n      tag.setAttribute('data-omelette-injected', '');\n      if (!own) document.head.appendChild(tag);\n    }\n\n    _scheduleMeasure() {\n      if (this._raf) return;\n      this._raf = requestAnimationFrame(() => { this._raf = null; this._measure(); });\n    }\n\n    /** Slot heights feed the print spacers (--doc-hdr-h / --doc-ftr-h), so\n     *  they re-measure on content mutation, resize, and font load. The\n     *  same pass detects explicit pagination (direct .page children) and\n     *  toggles the sheet between the flowing-document card and the\n     *  page-per-card stack — content edits can add or remove pages at any\n     *  time, so this tracks the same mutations the measurement does. */\n    _measure() {\n      const hdr = this.querySelector(':scope > [slot=\"header\"]');\n      const ftr = this.querySelector(':scope > [slot=\"footer\"]');\n      const wasPaginated = this._sheet.classList.contains('paginated');\n      this._sheet.classList.toggle(\n        'paginated',\n        this.querySelector(':scope > .page') !== null\n      );\n      // The WebKit @page margin is flowing-only, so a pagination flip\n      // must re-emit the rule (content edits can add or remove .page\n      // sections at any time).\n      if (this._sheet.classList.contains('paginated') !== wasPaginated) {\n        this._syncPrintPageRule();\n      }\n      this._syncSize(hdr ? hdr.offsetHeight : 0, ftr ? ftr.offsetHeight : 0);\n    }\n  }\n\n  if (!customElements.get('doc-page')) {\n    customElements.define('doc-page', DocPage);\n  }\n})();\n\n<\u002Fscript>\n<\u002Fhelmet>\n\n<doc-page margin=\"0.7in\">\n  <div slot=\"header\" style=\"display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding-bottom:8px;border-bottom:1px solid #dee6ee;font-family:'Manrope',sans-serif;font-size:10pt;letter-spacing:.12em;text-transform:uppercase;color:rgba(0,51,107,.5)\">\n    <span>ConstructFi · Design closeout<\u002Fspan>\n    <span>constructfi/constructfi-inc · main<\u002Fspan>\n  <\u002Fdiv>\n  <div slot=\"footer\" style=\"padding-top:8px;border-top:1px solid #dee6ee;font-family:'Manrope',sans-serif;font-size:10pt;color:rgba(0,51,107,.5)\">Confidential — for backend implementation. Issued 22 August 2026.<\u002Fdiv>\n\n  <div style=\"background:#041428;color:#fff;padding:34px 32px;margin-bottom:34px\">\n    <div style=\"font-family:'Manrope',sans-serif;font-size:11pt;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:#00d19a\">Design closeout · Backend handoff<\u002Fdiv>\n    <h1 style=\"margin:14px 0 0;font-family:'Fraunces',serif;font-size:31pt;font-weight:600;line-height:1.05;letter-spacing:-.02em;color:#fff\">The ConstructFi ecosystem site is designed. Here is what the backend has to stand up behind it.<\u002Fh1>\n    <p style=\"margin:16px 0 0;font-family:'Manrope',sans-serif;font-size:13pt;line-height:1.6;color:rgba(255,255,255,.78);max-width:62ch\">Eleven product pages, thirteen platform pages, seven interactive surfaces and one wallet affordance. Every screen is final on copy, structure and visual language. Nothing behind them is real yet.<\u002Fp>\n    <div style=\"margin-top:24px;display:grid;gap:14px;grid-template-columns:repeat(4,1fr)\">\n      <div style=\"border-top:2px solid #00d19a;padding-top:10px\">\n        <div style=\"font-family:'Fraunces',serif;font-size:20pt;font-weight:600;color:#fff\">24<\u002Fdiv>\n        <div style=\"font-family:'Manrope',sans-serif;font-size:10pt;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.6)\">Screens designed<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-top:2px solid #00d19a;padding-top:10px\">\n        <div style=\"font-family:'Fraunces',serif;font-size:20pt;font-weight:600;color:#fff\">7<\u002Fdiv>\n        <div style=\"font-family:'Manrope',sans-serif;font-size:10pt;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.6)\">Live calculators<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-top:2px solid #00d19a;padding-top:10px\">\n        <div style=\"font-family:'Fraunces',serif;font-size:20pt;font-weight:600;color:#fff\">11<\u002Fdiv>\n        <div style=\"font-family:'Manrope',sans-serif;font-size:10pt;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.6)\">Brand systems<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-top:2px solid #e4b95b;padding-top:10px\">\n        <div style=\"font-family:'Fraunces',serif;font-size:20pt;font-weight:600;color:#fff\">0<\u002Fdiv>\n        <div style=\"font-family:'Manrope',sans-serif;font-size:10pt;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.6)\">Live data sources<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <h2 style=\"margin:0;font-family:'Fraunces',serif;font-size:16pt;font-weight:600;letter-spacing:-.01em;color:#00336b\">1 · Where the design stands<\u002Fh2>\n  <p style=\"margin:10px 0 0;font-family:'Manrope',sans-serif;font-size:12pt;line-height:1.65;color:rgba(0,51,107,.82)\">The design reference is complete and internally consistent. Copy is final and must not be rewritten during implementation. Section order, visual hierarchy and per-product brand systems are final. What remains is entirely backend: every figure, listing, quote, verdict and balance on the site is currently a literal in the design file, chosen to be plausible rather than accurate.<\u002Fp>\n  <p style=\"margin:12px 0 0;font-family:'Manrope',sans-serif;font-size:12pt;line-height:1.65;color:rgba(0,51,107,.82)\">Two things are deliberately not designed and should not be inferred from the reference: authentication and the authenticated product interiors. The site is a marketing and participation surface. It ends at the point a user connects a wallet, downloads an app, or submits an enquiry.<\u002Fp>\n\n  <div style=\"margin-top:16px;border-left:3px solid #e4b95b;background:#fdfaf1;padding:16px 18px;break-inside:avoid\">\n    <div style=\"font-family:'Manrope',sans-serif;font-size:10pt;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#8a5b08\">Read this first<\u002Fdiv>\n    <p style=\"margin:8px 0 0;font-family:'Manrope',sans-serif;font-size:12pt;line-height:1.6;color:rgba(0,51,107,.85)\">The HTML design reference is not shippable code. Rebuild each screen in the Next.js app using the repo's existing components and Tailwind tokens. Pull exact colour values from <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11pt\">tailwind.config.ts<\u002Fspan>, not from t  the table live and names the lowest compliant quote, the spread and how many fell out.<\u002Fp>\n      <p style=\"margin:8px 0 0;font-family:'IBM Plex Mono',monospace;font-size:11pt;line-height:1.55;color:rgba(0,51,107,.82)\">NEEDS: supplier verification records (licensing, bonding, insurance, capacity) with refresh cadence · RFQ and quote entities · quote-state classification (Comparable / Qualified / Non-responsive) · award notification<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border:1px solid #dee6ee;padding:16px 18px;break-inside:avoid\">\n      <div style=\"font-family:'Manrope',sans-serif;font-size:13pt;font-weight:700;color:#00336b\">ConstructOS — module map and record trace<\u002Fdiv>\n      <p style=\"margin:7px 0 0;font-family:'Manrope',sans-serif;font-size:12pt;line-height:1.6;color:rgba(0,51,107,.8)\">Eight modules, each naming the record it writes, and a five-stage trace of one estimate line from bid to closeout.<\u002Fp>\n      <p style=\"margin:8px 0 0;font-family:'IBM Plex Mono',monospace;font-size:11pt;line-height:1.55;color:rgba(0,51,107,.82)\">NEEDS: confirmation that the record names match the real ERP schema. If they do not, the copy changes, not the layout<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border:1px solid #dee6ee;padding:16px 18px;break-inside:avoid\">\n      <div style=\"font-family:'Manrope',sans-serif;font-size:13pt;font-weight:700;color:#00336b\">House Hackers · Cashflow Tycoon · Brick by Brick — game surfaces<\u002Fdiv>\n      <p style=\"margin:7px 0 0;font-family:'Manrope',sans-serif;font-size:12pt;line-height:1.6;color:rgba(0,51,107,.8)\">A twelve-month move simulator, a plant shop with budget and payback, and a playable level with three solutions. All three are marketing demonstrations of real game mechanics.<\u002Fp>\n      <p style=\"margin:8px 0 0;font-family:'IBM Plex Mono',monospace;font-size:11pt;line-height:1.55;color:rgba(0,51,107,.82)\">NEEDS: the actual economy values from each game build, so the site does not teach numbers the game contradicts. Until then these must be labelled illustrative<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border:1px solid #dee6ee;padding:16px 18px;break-inside:avoid\">\n      <div style=\"font-family:'Manrope',sans-serif;font-size:13pt;font-weight:700;color:#00336b\">Wallet connect<\u002Fdiv>\n      <p style=\"margin:7px 0 0;font-family:'Manrope',sans-serif;font-size:12pt;line-height:1.6;color:rgba(0,51,107,.8)\">Header control with disconnected, menu and connected states, plus a matching entry point inside the COVI &amp; ELUV page.<\u002Fp>\n      <p style=\"margin:8px 0 0;font-family:'IBM Plex Mono',monospace;font-size:11pt;line-height:1.55;color:rgba(0,51,107,.82)\">NEEDS: wire to the repo's real wagmi/viem/Reown component. Addresses in the reference are fake, for layout only. Both entry points share one state<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <h2 style=\"margin:30px 0 0;font-family:'Fraunces',serif;font-size:16pt;font-weight:600;letter-spacing:-.01em;color:#00336b\">5 · Entities the backend has to own<\u002Fh2>\n  <p style=\"margin:10px 0 0;font-family:'Manrope',sans-serif;font-size:12pt;line-height:1.65;color:rgba(0,51,107,.82)\">Derived from what the screens display, not from an existing schema. Where the repo already has a model, prefer it and treat this as a field checklist.<\u002Fp>\n  <sc-raw-table style=\"margin-top:14px;width:100%;border-collapse:collapse;font-family:'Manrope',sans-serif;font-size:11pt\">\n    <sc-raw-thead>\n      <sc-raw-tr style=\"background:#f2f7fb\">\n        <sc-raw-th style=\"text-align:left;padding:9px 10px;border:1px solid #dee6ee;font-size:10pt;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:rgba(0,51,107,.6)\">Entity<\u002Fsc-raw-th>\n        <sc-raw-th style=\"text-align:left;padding:9px 10px;border:1px solid #dee6ee;font-size:10pt;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:rgba(0,51,107,.6)\">Fields the design displays<\u002Fsc-raw-th>\n      <\u002Fsc-raw-tr>\n    <\u002Fsc-raw-thead>\n    <sc-raw-tbody>\n      <sc-raw-tr><sc-raw-td style=\"padding:8px 10px;border:1px solid #dee6ee;font-weight:600\">Product<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 10px;border:1px solid #dee6ee\">slug, name, tagline, category, access, short, long, features[], forWho, store links[], external URL, brand tokens<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"padding:8px 10px;border:1px solid #dee6ee;font-weight:600\">Material lot<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 10px;border:1px solid #dee6ee\">code, name, description, unit, unit price, retail benchmark, quantity available, increment, origin job, grade, photos, pickup window<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"padding:8px 10px;border:1px solid #dee6ee;font-weight:600\">Reservation<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 10px;border:1px solid #dee6ee\">lot, quantity, buyer, hold expiry (48h), status, collection date<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"padding:8px 10px;border:1px solid #dee6ee;font-weight:600\">Supplier<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 10px;border:1px solid #dee6ee\">id, name, trades, licensing record, bonding confirmation, insurance certificate + carrier check, declared capacity, each with last-verified timestamp<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"padding:8px 10px;border:1px solid #dee6ee;font-weight:600\">RFQ / Quote<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 10px;border:1px solid #dee6ee\">rfq id, scope, issued date, supplier, price, schedule days, state (comparable / qualified / non-responsive), exception note, validity, award flag<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"padding:8px 10px;border:1px solid #dee6ee;font-weight:600\">Deal model run<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 10px;border:1px solid #dee6ee\">inputs (price, rent, rate, term, expenses), outputs (cap rate, DSCR, cash flow), verdict, threshold set version, timestamp<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"padding:8px 10px;border:1px solid #dee6ee;font-weight:600\">Wallet session<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 10px;border:1px solid #dee6ee\">address, chain (Base), connector, KYC/allowlist status, connected-at. Non-custodial — no keys, no funds<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"padding:8px 10px;border:1px solid #dee6ee;font-weight:600\">Token status<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 10px;border:1px solid #dee6ee\">symbol, standard, cap, chain, contract address (publishes only after audit), capability status per row<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"padding:8px 10px;border:1px solid #dee6ee;font-weight:600\">Enquiry<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 10px;border:1px solid #dee6ee\">name, organisation, email, interest, message, source page, timestamp<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <\u002Fsc-raw-tbody>\n  <\u002Fsc-raw-table>\n\n  <h2 style=\"margin:30px 0 0;font-family:'Fraunces',serif;font-size:16pt;font-weight:600;letter-spacing:-.01em;color:#00336b\">6 · Rules that must survive implementation<\u002Fh2>\n  <p style=\"margin:10px 0 0;font-family:'Manrope',sans-serif;font-size:12pt;line-height:1.65;color:rgba(0,51,107,.82)\">Each product's brand standards were approved separately and are enforced on its page. These are the ones most easily broken by a well-meaning refactor into shared components.<\u002Fp>\n  <div style=\"margin-top:14px;display:grid;gap:9px\">\n    <div style=\"display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;border-top:1px solid #dee6ee;padding-top:9px;break-inside:avoid\">\n      <span style=\"font-family:'Manrope',sans-serif;font-size:11.5pt;font-weight:700;color:#00336b\">Colour is semantic<\u002Fspan>\n      <span style=\"font-family:'Manrope',sans-serif;font-size:12pt;line-height:1.55;color:rgba(0,51,107,.8)\">A brand colour never signals status. ConstructOS teal marks AI and nothing else and stays under 10% of a surface. Material Marketplace amber is price only. Cashflow Tycoon amber is the thing about to be pressed. House Hackers gold is equity, green is cash flow, red is debt.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;border-top:1px solid #dee6ee;padding-top:9px;break-inside:avoid\">\n      <span style=\"font-family:'Manrope',sans-serif;font-size:11.5pt;font-weight:700;color:#00336b\">Typefaces are per product<\u002Fspan>\n      <span style=\"font-family:'Manrope',sans-serif;font-size:12pt;line-height:1.55;color:rgba(0,51,107,.8)\">Eleven products, eleven type systems, applied inside the product page. The house system (Fraunces on h1/h2, Manrope elsewhere) governs everything outside them. Do not normalise the product pages onto the house stack.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;border-top:1px solid #dee6ee;padding-top:9px;break-inside:avoid\">\n      <span style=\"font-family:'Manrope',sans-serif;font-size:11.5pt;font-weight:700;color:#00336b\">Qualifiers are load-bearing<\u002Fspan>\n      <span style=\"font-family:'Manrope',sans-serif;font-size:12pt;line-height:1.55;color:rgba(0,51,107,.8)\">PactPilot must carry its \"not legal advice\" qualifier on every surface bearing the mark. The games carry \"a game, not advice\". Collections language avoids yield, APY, passive income, revenue share and dividend entirely.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;border-top:1px solid #dee6ee;padding-top:9px;break-inside:avoid\">\n      <span style=\"font-family:'Manrope',sans-serif;font-size:11.5pt;font-weight:700;color:#00336b\">Status is pre-audit<\u002Fspan>\n      <span style=\"font-family:'Manrope',sans-serif;font-size:12pt;line-height:1.55;color:rgba(0,51,107,.8)\">Every token capability reads pre-audit and every dashboard figure is marked illustrative. No contract address publishes before audit. Do not let real-looking data ship under these labels.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;border-top:1px solid #dee6ee;padding-top:9px;break-inside:avoid\">\n      <span style=\"font-family:'Manrope',sans-serif;font-size:11.5pt;font-weight:700;color:#00336b\">No emoji<\u002Fspan>\n      <span style=\"font-family:'Manrope',sans-serif;font-size:12pt;line-height:1.55;color:rgba(0,51,107,.8)\">Not in the app, not in push, not in email. Status is a colour, a dot, or a word.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <h2 style=\"margin:30px 0 0;font-family:'Fraunces',serif;font-size:16pt;font-weight:600;letter-spacing:-.01em;color:#00336b\">7 · Open before launch<\u002Fh2>\n  <p style=\"margin:10px 0 0;font-family:'Manrope',sans-serif;font-size:12pt;line-height:1.65;color:rgba(0,51,107,.82)\">Six items, none of them design work. The first three block launch.<\u002Fp>\n  <div style=\"margin-top:14px;display:grid;gap:10px\">\n    <div style=\"border:1px solid #dee6ee;border-left:3px solid #c0341f;padding:14px 16px;break-inside:avoid\">\n      <div style=\"font-family:'Manrope',sans-serif;font-size:12pt;font-weight:700;color:#00336b\">Store listing URLs<\u002Fdiv>\n      <p style=\"margin:6px 0 0;font-family:'Manrope',sans-serif;font-size:12pt;line-height:1.55;color:rgba(0,51,107,.78)\">All ten products point at App Store and Google Play <em>search<\u002Fem> URLs. Real listing links or bundle IDs are needed before these buttons go live, or the buttons should be hidden per product until its listing exists.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border:1px solid #dee6ee;border-left:3px solid #c0341f;padding:14px 16px;break-inside:avoid\">\n      <div style=\"font-family:'Manrope',sans-serif;font-size:12pt;font-weight:700;color:#00336b\">Legal review<\u002Fdiv>\n      <p style=\"margin:6px 0 0;font-family:'Manrope',sans-serif;font-size:12pt;line-height:1.55;color:rgba(0,51,107,.78)\">COVI &amp; ELUV FAQ, disclaimer and status language, plus the PactPilot qualifier, need counsel sign-off before publication.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border:1px solid #dee6ee;border-left:3px solid #c0341f;padding:14px 16px;break-inside:avoid\">\n      <div style=\"font-family:'Manrope',sans-serif;font-size:12pt;font-weight:700;color:#00336b\">Real numbers for the seven calculators<\u002Fdiv>\n      <p style=\"margin:6px 0 0;font-family:'Manrope',sans-serif;font-size:12pt;line-height:1.55;color:rgba(0,51,107,.78)\">Either supply real values or keep the illustrative labelling. Plausible-but-invented figures presented as fact is the one failure mode this design cannot absorb.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border:1px solid #dee6ee;padding:14px 16px;break-inside:avoid\">\n      <div style=\"font-family:'Manrope',sans-serif;font-size:12pt;font-weight:700;color:#00336b\">Accessibility audit<\u002Fdiv>\n      <p style=\"margin:6px 0 0;font-family:'Manrope',sans-serif;font-size:12pt;line-height:1.55;color:rgba(0,51,107,.78)\">Contrast across the eleven product palettes, visible focus states on every slider and clickable row, keyboard operation of the selectable lists (currently click-only in the reference), and prefers-reduced-motion on the 150ms card lift.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border:1px solid #dee6ee;padding:14px 16px;break-inside:avoid\">\n      <div style=\"font-family:'Manrope',sans-serif;font-size:12pt;font-weight:700;color:#00336b\">Two academies and Collections<\u002Fdiv>\n      <p style=\"margin:6px 0 0;font-family:'Manrope',sans-serif;font-size:12pt;line-height:1.55;color:rgba(0,51,107,.78)\">These three product pages carry the standard treatment while the other eight have a built-out detail section. Not a defect, but the inconsistency will be visible to anyone browsing the marketplace end to end. Worth deciding before launch rather than after.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border:1px solid #dee6ee;padding:14px 16px;break-inside:avoid\">\n      <div style=\"font-family:'Manrope',sans-serif;font-size:12pt;font-weight:700;color:#00336b\">Handoff bundle is stale<\u002Fdiv>\n      <p style=\"margin:6px 0 0;font-family:'Manrope',sans-serif;font-size:12pt;line-height:1.55;color:rgba(0,51,107,.78)\">The README, implementation plan and standalone copy in <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11pt\">design_handoff_ecosystem_site/<\u002Fspan> predate the product build-outs, the House Hackers rename and the store links. Regenerate before the developer works from them.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <h2 style=\"margin:30px 0 0;font-family:'Fraunces',serif;font-size:16pt;font-weight:600;letter-spacing:-.01em;color:#00336b\">8 · Acceptance checklist<\u002Fh2>\n  <p style=\"margin:10px 0 0;font-family:'Manrope',sans-serif;font-size:12pt;line-height:1.65;color:rgba(0,51,107,.82)\">What \"matches the design\" means, in terms that can be checked.<\u002Fp>\n  <div style=\"margin-top:12px;display:grid;gap:7px\">\n    <div style=\"display:flex;gap:11px;align-items:flex-start;border-bottom:1px solid #eef3f8;padding-bottom:7px\"><span style=\"flex:none;width:13px;height:13px;border:1.5px solid #00a87c;margin-top:3px\"><\u002Fspan><span style=\"font-family:'Manrope',sans-serif;font-size:12pt;line-height:1.55;color:rgba(0,51,107,.82)\">All copy matches the reference word for word, including qualifiers and voice.<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;gap:11px;align-items:flex-start;border-bottom:1px solid #eef3f8;padding-bottom:7px\"><span style=\"flex:none;width:13px;height:13px;border:1.5px solid #00a87c;margin-top:3px\"><\u002Fspan><span style=\"font-family:'Manrope',sans-serif;font-size:12pt;line-height:1.55;color:rgba(0,51,107,.82)\">Each product page renders in its own typeface and palette, not the house stack.<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;gap:11px;align-items:flex-start;border-bottom:1px solid #eef3f8;padding-bottom:7px\"><span style=\"flex:none;width:13px;height:13px;border:1.5px solid #00a87c;margin-top:3px\"><\u002Fspan><span style=\"font-family:'Manrope',sans-serif;font-size:12pt;line-height:1.55;color:rgba(0,51,107,.82)\">Every calculator recomputes on input with no page reload, and reports the same figures as the reference for the same inputs.<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;gap:11px;align-items:flex-start;border-bottom:1px solid #eef3f8;padding-bottom:7px\"><span style=\"flex:none;width:13px;height:13px;border:1.5px solid #00a87c;margin-top:3px\"><\u002Fspan><span style=\"font-family:'Manrope',sans-serif;font-size:12pt;line-height:1.55;color:rgba(0,51,107,.82)\">Negative currency reads with the sign ahead of the symbol throughout.<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;gap:11px;align-items:flex-start;border-bottom:1px solid #eef3f8;padding-bottom:7px\"><span style=\"flex:none;width:13px;height:13px;border:1.5px solid #00a87c;margin-top:3px\"><\u002Fspan><span style=\"font-family:'Manrope',sans-serif;font-size:12pt;line-height:1.55;color:rgba(0,51,107,.82)\">Wallet control shows one shared state across header and participation page, against a real provider.<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;gap:11px;align-items:flex-start;border-bottom:1px solid #eef3f8;padding-bottom:7px\"><span style=\"flex:none;width:13px;height:13px;border:1.5px solid #00a87c;margin-top:3px\"><\u002Fspan><span style=\"font-family:'Manrope',sans-serif;font-size:12pt;line-height:1.55;color:rgba(0,51,107,.82)\">No contract address, live balance or unlabelled figure appears anywhere pre-audit.<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;gap:11px;align-items:flex-start;border-bottom:1px solid #eef3f8;padding-bottom:7px\"><span style=\"flex:none;width:13px;height:13px;border:1.5px solid #00a87c;margin-top:3px\"><\u002Fspan><span style=\"font-family:'Manrope',sans-serif;font-size:12pt;line-height:1.55;color:rgba(0,51,107,.82)\">Every interactive control is reachable and operable by keyboard, with a visible focus state.<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;gap:11px;align-items:flex-start;padding-bottom:7px\"><span style=\"flex:none;width:13px;height:13px;border:1.5px solid #00a87c;margin-top:3px\"><\u002Fspan><span style=\"font-family:'Manrope',sans-serif;font-size:12pt;line-height:1.55;color:rgba(0,51,107,.82)\">Store buttons either resolve to a real listing or do not render.<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n\n  <p style=\"margin:26px 0 0;padding-top:14px;border-top:2px solid #041428;font-family:'Manrope',sans-serif;font-size:11.5pt;line-height:1.6;color:rgba(0,51,107,.7)\">Design reference: <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11pt\">ConstructFi Site v2.dc.html<\u002Fspan> and its standalone copy. Repo: <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11pt\">constructfi/constructfi-inc<\u002Fspan>, branch <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11pt\">main<\u002Fspan>. Questions on intent go back to design before they are resolved in code.<\u002Fp>\n<\u002Fdoc-page>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
